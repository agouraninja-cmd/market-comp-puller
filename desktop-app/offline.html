<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CompNinja — offline</title>
  <style>
    /* The site's paper/ink/red, hand-held: this page renders with no network,
       so it can borrow nothing from compninja.co. */
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center;
      background: #FBFBF9; color: #1A2433;
      font: 15px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .card { text-align: center; max-width: 42ch; padding: 24px; }
    .mark { width: 56px; height: 56px; margin: 0 auto 14px; display: block; }
    h1 { font-size: 17px; margin: 0 0 6px; }
    p { margin: 0 0 18px; color: #5B6472; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #B91C1C;
      border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer;
    }
    button:hover { background: #991B1B; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="4" width="26" height="22" rx="2" fill="#1A2433"/><polygon points="3.5,26 28,5.5 28,10 8,26" fill="#B91C1C"/></svg>
    <h1>Can't reach CompNinja</h1>
    <p>Check your internet connection, then try again.</p>
    <button id="retry" type="button">Try again</button>
  </div>
  <script>
    // main.js passes the app URL as ?to= so this page never hardcodes it.
    var to = new URLSearchParams(location.search).get("to") || "https://compninja.co/";
    if (!/^https:\/\//.test(to)) to = "https://compninja.co/";
    document.getElementById("retry").addEventListener("click", function () {
      location.href = to;
    });
  </script>
</body>
</html>
