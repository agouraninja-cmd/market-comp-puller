# CI: catches what would otherwise ship straight to prod, since Render
# deploys main on every push. Three layers, all dependency-free:
#   1. node --check on every entry point (a syntax error in server.js would
#      take the whole site down at boot).
#   2. npm test — the entitlements/comp-gate/stripe decision tables.
#   3. Boot smoke: start server.js with no env at all and require /healthz
#      and / to answer 200, proving the server survives a bare environment
#      (no API key, no Supabase, no Stripe — everything optional degrades).
# No secrets are configured here on purpose: server.js boots without any,
# and CI must never hold a key that a fork PR could exfiltrate.
name: CI

on:
  push:
  pull_request:
  # A manual "Run workflow" button, on any branch. Added 2026-08-06 after a
  # GitHub Actions incident (15:22 UTC, ~7 hours) in which webhook triggers
  # were throttled to about 15%: pushes and pull requests simply stopped
  # creating workflow runs. Four branches were merged to main that day with no
  # CI result at all, and Render deploys main on every push, so unverified code
  # shipped — not because a check failed, but because no check was ever made.
  #
  # push/pull_request arrive as WEBHOOK DELIVERIES and are the first thing shed
  # when Actions is shedding load. workflow_dispatch is a direct API call from
  # the Actions tab instead, so it is the one trigger that still works when
  # those are being dropped. It is also the way to re-run CI for a commit
  # already on main without pushing an empty commit to get a webhook.
  #
  # Purely additive: it changes nothing about what CI checks or when it fires
  # normally, and it cannot be used to SKIP a check, only to start one. Safe to
  # expose because this workflow deliberately holds no secrets (see the note at
  # the top of this file), so a manually started run has nothing to leak.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax-check entry points
        run: |
          for f in server.js entitlements.js comp-gate.js stripe.js gen-market-seed.js market-snapshot.js desktop.js; do
            node --check "$f"
          done

      - name: Run test suite
        run: npm test

      # devlog.json is UTF-8 and full of em dashes and curly quotes. An editor
      # that saves it as Windows-1252 re-encodes every one of them into
      # sequences like "ÃƒÆ’Ã†â€™" — and because each merge that resolves this
      # file re-mangles what is already mangled, the damage roughly doubled on
      # every merge: 60 -> 182 -> 481 -> 1088 -> 2307 occurrences across five
      # merges before anyone noticed. Nothing reads devlog.json but /dev, so it
      # rots silently. This fails the build the first time instead.
      - name: devlog.json is valid UTF-8 JSON, with no mojibake
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("devlog.json");
            if (raw.includes("﻿")) { console.error("devlog.json has a BOM — save it as UTF-8 without one."); process.exit(1); }
            const text = raw.toString("utf8");
            const entries = JSON.parse(text);   // throws on malformed JSON
            const bad = entries.filter((e) => /Ã|â€|Â/.test(JSON.stringify(e)));
            if (bad.length) {
              console.error(`${bad.length} devlog entry(ies) contain mojibake — devlog.json was saved as Windows-1252, not UTF-8.`);
              console.error("Re-save it as UTF-8. If you resolved a merge conflict here, your editor is the cause.");
              for (const e of bad.slice(0, 5)) console.error(`  ${e.date}  ${String(e.title).slice(0, 60)}`);
              process.exit(1);
            }
            console.log(`devlog.json OK — ${entries.length} entries, clean UTF-8.`);
          '

      - name: Boot smoke test
        run: |
          PORT=3199 node server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3199/healthz > /dev/null; then break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "server exited early"; exit 1; fi
            sleep 0.5
          done
          curl -sf http://localhost:3199/healthz
          # The landing page must render, not just the health probe.
          #
          # -L (follow redirects) is load-bearing since the account wall shipped:
          # with ACCOUNT_WALL on (the default) an anonymous GET / answers 302 to
          # /how-it-works, so an unfollowed request returns an empty body and
          # this grep fails even though the app is perfectly healthy. That broke
          # CI on main. Following the redirect asserts what actually matters —
          # an anonymous visitor lands on a rendered CompNinja page — and holds
          # whether the wall is on or off.
          curl -sfL http://localhost:3199/ | grep -qi "compninja" || { echo "landing page did not render"; exit 1; }
          # And the app itself must render for a request carrying a session
          # cookie, which the line above never exercises: with the wall on it
          # follows the redirect to the front door instead. Cookie PRESENCE is
          # all the routing layer checks, so any value works. Lever-safe too —
          # with the wall off this path serves the app to everyone anyway.
          curl -sf -H 'Cookie: cn_session=ci-smoke' http://localhost:3199/ | grep -qi "compninja" || { echo "app did not render for a signed-in request"; exit 1; }
          kill $SERVER_PID
