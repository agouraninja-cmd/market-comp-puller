# iOS: builds the CompNinja iPhone app on a GitHub-hosted Mac and, when asked,
# uploads it to App Store Connect (it then shows up in TestFlight). This is
# the no-Mac route: nobody needs Xcode on their own machine to ship a build.
#
# Two ways it runs:
#   - push touching ios/** (or this file): BUILD ONLY. Proves the app still
#     compiles with the current Xcode. Needs no secrets, uploads nothing.
#   - "Run workflow" button (workflow_dispatch) with upload ticked: build,
#     sign with Apple's cloud-managed certificate, upload to App Store Connect.
#
# Secrets (repo Settings -> Secrets and variables -> Actions), from an App
# Store Connect API key with the ADMIN role (cloud signing refuses lesser
# roles), created at App Store Connect -> Users and Access -> Integrations:
#   ASC_KEY_ID     the Key ID (10 characters)
#   ASC_ISSUER_ID  the Issuer ID (a UUID, shown above the key list)
#   ASC_KEY_P8     the whole text of the downloaded AuthKey_XXXX.p8 file
#
# Mac minutes cost 10x on a private repo's free allowance, which is why this
# does not run on every push to the repo, only on pushes that touch the app.
name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect / TestFlight"
        type: boolean
        default: true

# Two uploads racing would fight over the same build number.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    steps:
      - uses: actions/checkout@v4

      # App Store uploads must be built with a current SDK (Xcode 26 / iOS 26
      # since April 2026). Pick the newest Xcode the runner image carries and
      # say which, so a stale image is obvious in the log rather than a
      # rejection email from Apple a day later.
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      # Every upload needs a build number App Store Connect has never seen.
      # The run number only grows; the +100 clears any build Owen uploaded by
      # hand from his Mac before this existed.
      - name: Build number
        run: echo "BUILD_NUMBER=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      # Archived with signing OFF. The Release config in project.yml is set up
      # for the Mac route (manual signing, a named profile, a keychain cert);
      # those three are cleared here so the runner never looks for them.
      # Signing happens at export, below, with the cloud certificate.
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild -project CompNinja.xcodeproj -scheme CompNinja \
            -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/CompNinja.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive | tee build-log.txt | grep -E "error:|warning: .*deprecated|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d build/CompNinja.xcarchive || { echo "::error::Archive failed, see the uploaded build log"; exit 1; }

      # project.yml writes CFBundleVersion as a literal "1", so the setting
      # above does not reach Info.plist; stamp it into the archived app.
      - name: Stamp build number
        working-directory: ios
        run: |
          PL=build/CompNinja.xcarchive/Products/Applications/CompNinja.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PL"
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $BUILD_NUMBER" build/CompNinja.xcarchive/Info.plist
          echo "Version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL") build $BUILD_NUMBER"

      - name: Install API key
        if: env.UPLOAD == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 secrets are not set. See the top of .github/workflows/ios.yml."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          F="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          # Pasted from Notepad on Windows the secret arrives with CRLF line
          # endings, stray spaces, sometimes without the BEGIN/END lines or
          # folded onto one line; xcodebuild then refuses it as
          # "invalidPEMDocument" (hit on the first upload, 2026-11-20).
          # Keep only the base64 body and rebuild a clean PEM around it.
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' \
            | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \t\n')
          if [ -z "$BODY" ] || ! printf '%s' "$BODY" | base64 -D >/dev/null 2>&1; then
            echo "::error::ASC_KEY_P8 is not a .p8 private key. Paste the whole text of the AuthKey_XXXX.p8 file."
            exit 1
          fi
          { echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64; echo
            echo "-----END PRIVATE KEY-----"; } > "$F"
          # Shape only, never the key: a .p8 body is about 200 characters.
          echo "Key file written: ${#BODY} base64 characters"

      - name: Sign and upload to App Store Connect
        if: env.UPLOAD == 'true'
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/CompNinja.xcarchive \
            -exportOptionsPlist ExportOptions-ci.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          echo "::notice::Build $BUILD_NUMBER uploaded. It appears in App Store Connect -> TestFlight after Apple finishes processing (usually 5-30 minutes)."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build-log.txt
          if-no-files-found: ignore
          retention-days: 14
