  HOW TO INSTALL

            Create new -> paste -> Save changes at the bottom of the page.
    Outlook File -> Options -> Mail -> Signatures -> New -> paste.
    Apple   Mail -> Settings -> Signatures -> new signature -> paste, then
      Mail  UNTICK "Always match my default message font".

  THE LOGO IS EMBEDDED as a data: URI, so this file is self-contained and the
