  CompNinja email signature — Jacob Adler, CEO.

  HOW TO INSTALL
    Gmail   Open this file in a browser, select the block below (Ctrl/Cmd+A),
            copy, then Settings -> See all settings -> General -> Signature ->
            Create new -> paste. Leave "Insert signature before quoted text"
            checked if you reply above the quote.
    Outlook File -> Options -> Mail -> Signatures -> New -> paste.
    Apple   Mail -> Settings -> Signatures -> new signature -> paste, then
      Mail  UNTICK "Always match my default message font".

  DESIGN NOTES (same constraints as email-shell.js, the outbound letterhead
  this is styled to match — do not "modernize" them away):
    - table layout + inline styles only (Gmail strips <style>, Outlook renders
      through Word);
    - system fonts only (Arial ships everywhere, webfonts do not);
    - NO images. The wordmark is text, because remote images are blocked by
      default in most clients and a signature must survive that. Adding a logo
      PNG would leave a grey placeholder box in the majority of inboxes.
    - Colours are email-shell.js's: ink #1A2433, body #374253, muted #68707E,
      red #B91C1C, hairline #E4E2DA.

  COPY RULES (CLAUDE.md): the owner is not a licensed broker, so this may
  never describe CompNinja as a brokerage or its output as an appraisal.
  "Adler" here is the CEO's own surname on his own signature — it is not the
  retired Adler Industrial branding the repo rule forbids reintroducing.
-->
