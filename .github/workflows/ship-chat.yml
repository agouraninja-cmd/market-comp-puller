# The nightly "who shipped what" post to the team's Google Chat space, and the
# numbers behind the shipped board at compninja.co/dev/shipped. The post is a
# card with Jacob's, Owen's and Chuck's commits for the day that just ended,
# as Chat text, and a button to the board, which draws the 14-day chart and
# the day's PRs at full size. The rules (who gets credit, which day a merge
# belongs to, when the chart resets) live in ship-board.js, shared by
# scripts/ship-chat.js and server.js, and are tested in test/ship-chat.test.js.
#
# Midnight in Boise, every night. GitHub cron is UTC and Boise moves an hour
# twice a year, so this fires at BOTH candidate hours and the script posts
# from the one that matches the season — one post a night, all year, which
# the test suite checks for every night of two years. Scheduled Actions are
# often late; the script reports "the Boise day it was six hours ago", so a
# late start still reports the right day.
#
# NEEDS ONE REPOSITORY SECRET, GOOGLE_CHAT_WEBHOOK_URL — the incoming webhook
# made in the Chat space (space name > Apps & integrations > Webhooks). It
# fails loudly without it rather than skipping quietly, the permit sweep's
# rule: a scheduled job that passes while doing nothing is a post that
# silently stopped. The PR counts need nothing extra; the job's own token
# reads them.
#
# The board reads each day from the `ship-charts` branch, where this saves it
# as days/<YYYY-MM-DD>.json. That branch is ONE parentless commit, force-pushed
# every night, holding the newest 120 days — so it never grows history and
# never bloats a clone. Never merge it. The day is saved BEFORE the post, so
# the post's button never leads to yesterday's board; if saving fails the
# post still goes out and the job then fails, so somebody hears about it.
# (Until 2026-09-25 this branch held a PNG of the card, posted as a picture;
# Chat shrank it until it was unreadable, and the board replaced it.)
#
# Every post lands in ONE thread of the CompNinja space, the "Developer
# thread" (THREAD_KEY in the script), not a new thread a night.
#
# "Run workflow" takes a day to post, a dry-run switch that counts the day and
# keeps it (and a copy of the board page) as a run artifact without saving or
# posting anything, and a start-thread switch that posts the thread's opening
# message first. That one is for the first post only — pressed again it would
# repeat the opening message inside the thread. skip_post saves the day for
# the board without posting, for putting a past day on the board quietly.
name: Ship chat

on:
  schedule:
    - cron: "7 6 * * *" # 00:07 in Boise on daylight time (MDT)
    - cron: "7 7 * * *" # 00:07 in Boise on standard time (MST)
  workflow_dispatch:
    inputs:
      day:
        description: "Day to post, YYYY-MM-DD (blank = the day that just ended)"
        required: false
        default: ""
      dry_run:
        description: "Count the day only: no saving, no post"
        type: boolean
        default: false
      start_thread:
        description: "Open the Developer thread first (first post only)"
        type: boolean
        default: false
      skip_post:
        description: "Save the day for the board but post nothing"
        type: boolean
        default: false

permissions:
  contents: write # save the day to the ship-charts branch
  pull-requests: read

concurrency:
  group: ship-chat
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Count the day
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHIP_SCHEDULE: ${{ github.event.schedule }}
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ]; then
            node scripts/ship-chat.js build --out out --day "$DAY"
          else
            node scripts/ship-chat.js build --out out
          fi

      - name: Keep the day with the run
        if: steps.build.outputs.post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ship-day
          path: out/
          retention-days: 14

      - name: Check the webhook secret
        if: steps.build.outputs.post == 'true' && !inputs.dry_run && !inputs.skip_post
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
        run: |
          if [ -z "$GOOGLE_CHAT_WEBHOOK_URL" ]; then
            echo "::error::The GOOGLE_CHAT_WEBHOOK_URL repository secret is not set, so there is nowhere to post. Make an incoming webhook in the Chat space and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Save the day for the board
        id: save
        if: steps.build.outputs.post == 'true' && !inputs.dry_run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DAY_OUT: ${{ steps.build.outputs.day }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          dir="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$remote" ship-charts >/dev/null 2>&1; then
            git clone -q --depth 1 --branch ship-charts "$remote" "$dir"
          else
            git init -q "$dir"
          fi
          mkdir -p "$dir/days"
          cp out/model.json "$dir/days/${DAY_OUT}.json"
          cd "$dir"
          rm -f -- *.png
          ls -1 days/*.json | sort | head -n -120 | xargs -r rm -f --
          printf '%s\n' "# ship-charts" "" \
            "The shipped board's data: one days/YYYY-MM-DD.json per day, written by .github/workflows/ship-chat.yml on main and read by compninja.co/dev/shipped." \
            "Force-pushed as one parentless commit every night, keeping the newest 120 days. Never merge this branch." > README.md
          git add -A
          commit="$(git commit-tree "$(git write-tree)" -m "Shipped board through ${DAY_OUT}")"
          git push -q -f "$remote" "${commit}:refs/heads/ship-charts"
          echo "Saved days/${DAY_OUT}.json"

      - name: Post to Google Chat
        if: steps.build.outputs.post == 'true' && !inputs.dry_run && !inputs.skip_post
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          START_THREAD: ${{ inputs.start_thread }}
        run: |
          args=(post --out out)
          if [ "$START_THREAD" = "true" ]; then args+=(--intro); fi
          node scripts/ship-chat.js "${args[@]}"

      - name: Fail if the board was not saved
        if: steps.save.outcome == 'failure'
        run: |
          echo "::error::The post went out, but the day was not saved to the ship-charts branch, so the board still shows an earlier day. See the 'Save the day for the board' step."
          exit 1
