# The permit sweep's schedule (permit signals, spec §3 and §8 slice 2).
#
# The sweep is a ROUTE, never a timer inside server.js — the watchlist
# digest's rule: a setInterval fires at an hour nobody chose, again after
# every deploy, and twice on two instances. So the schedule lives here, and
# all this does is ask the live site to run one sweep. The route is
# idempotent (unique on jurisdiction + permit number, ignore-duplicates), so
# a double fire or a manual "Run workflow" beside the cron costs portal
# requests and nothing else.
#
# Weekdays at 13:00 UTC (7am in Boise), because the city portals only move
# on working days and the building sheet calls a sweep "stale" once it is a
# business day old. The default window is four days, so Monday's run covers
# the weekend and a missed day heals itself.
#
# NEEDS ONE REPOSITORY SECRET, ADMIN_KEY — the same key /admin takes. It fails
# loudly without it rather than skipping quietly: a scheduled workflow that
# passes while doing nothing is a tracker that silently stopped tracking,
# which is exactly what the building sheet's "last checked" line would then
# have to confess to a customer.
#
# The job also fails when the sweep answers with a city error (a portal
# redesign, the Nampa-style bot wall reaching another city), because a failed
# scheduled run is what actually reaches somebody. The capture script
# (scripts/capture-permit-fixtures.js) is how that is diagnosed.
name: Permit sweep

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to read (1-60)"
        required: false
        default: "4"
      history:
        description: "Older months to re-read after the sweep: rotate (this month, last month and one older), all (the whole last year in the background, the one-off backfill), or off"
        required: false
        default: "rotate"
        type: choice
        options: [rotate, all, off]

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Run one sweep against the live site
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SITE: https://compninja.co
          DAYS: ${{ github.event.inputs.days || '4' }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then
            echo "::error::The ADMIN_KEY repository secret is not set, so the permit sweep cannot run. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          status=$(curl -sS -o sweep.json -w '%{http_code}' --max-time 1080 \
            -X POST "$SITE/api/permits/sweep" \
            -H "x-admin-key: $ADMIN_KEY" -H 'content-type: application/json' \
            -d "{\"days\": $DAYS}")
          echo "HTTP $status"
          cat sweep.json; echo
          if [ "$status" = "409" ]; then
            echo "::notice::A sweep was already running; this one stood down."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::error::The sweep answered HTTP $status."
            exit 1
          fi
          node -e '
            const s = JSON.parse(require("fs").readFileSync("sweep.json", "utf8"));
            console.log(`discovered ${s.discovered} · added ${s.added} · status changes ${s.statusChanges} · industrial ${s.industrial}`);
            if (s.truncated && s.truncated.length) console.log(`::warning::Truncated at the page cap: ${s.truncated.join(", ")}`);
            // Tracked permits (054) ride this run. Their problems WARN rather
            // than fail: a permit the portal cannot find for one member is not the
            // city sweep breaking. Emails pending means outbound mail is off.
            const w = s.watches || {};
            console.log(`tracked permits: ${w.checked || 0} checked · ${w.notices || 0} notice(s) · ${w.emailed || 0} emailed${w.emailsPending ? ` · ${w.emailsPending} email(s) pending` : ""}`);
            if (w.errors && w.errors.length) console.log(`::warning::Tracked permits: ${w.errors.join(" | ")}`);
            if (w.mailOff) console.log("::warning::Permit notice emails are waiting: outbound mail (EMAIL_FROM + RESEND_API_KEY) is not configured.");
            // Permit alerts (057) ride the same run, and warn the same way.
            const al = s.alerts || {};
            if (s.alerts) console.log(`permit alerts: ${al.alerts || 0} alert(s) · ${al.emailed || 0} emailed${al.pending ? ` · ${al.pending} waiting` : ""}`);
            if (al.errors && al.errors.length) console.log(`::warning::Permit alerts: ${al.errors.join(" | ")}`);
            if (al.mailOff) console.log("::warning::Permit alert emails are waiting: outbound mail (EMAIL_FROM + RESEND_API_KEY) is not configured.");
            // Nampa, from the reports the city publishes (2026-10-01). One
            // unreadable report among several WARNS; the page or every report
            // failing is in s.errors below and fails the job.
            const na = (s.cities || {}).nampa;
            if (na) console.log(`nampa (from its reports): ${na.reports || 0} report(s) read · ${na.added || 0} added · ${na.statusChanges || 0} status change(s)`);
            if (na && na.reportErrors && na.reportErrors.length) console.log(`::warning::Nampa reports: ${na.reportErrors.join(" | ")}`);
            // Placing permits on the map (058). Its problems WARN, never fail.
            const lo = s.located || {};
            if (s.located) console.log(`placed on the map: ${lo.placed || 0} of ${lo.tried || 0} looked up`);
            if (lo.errors && lo.errors.length) console.log(`::warning::Placing permits: ${lo.errors.join(" | ")}`);
            if (s.errors && s.errors.length) { console.log(`::error::${s.errors.join(" | ")}`); process.exit(1); }
          '

      # The history pass (2026-10-01): whole calendar months re-read, which keeps
      # every stored permit's status current for the permit section of the
      # market pages, and on "all" fills in the past year. Its own call, after
      # the sweep, so each has its own time budget: a month of one city is
      # about 100 seconds of portal reads. Its problems WARN, never fail the job.
      - name: Re-read older months
        if: ${{ (github.event.inputs.history || 'rotate') != 'off' }}
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          SITE: https://compninja.co
          HISTORY: ${{ github.event.inputs.history || 'rotate' }}
        run: |
          status=$(curl -sS -o history.json -w '%{http_code}' --max-time 1500 \
            -X POST "$SITE/api/permits/sweep" \
            -H "x-admin-key: $ADMIN_KEY" -H 'content-type: application/json' \
            -d "{\"only\": \"history\", \"history\": \"$HISTORY\"}") || status=timeout
          echo "HTTP $status"
          cat history.json 2>/dev/null; echo
          if [ "$status" = "202" ]; then
            echo "::notice::The backfill of the last year started in the background. It takes about 45 minutes; its result shows on /admin."
            exit 0
          fi
          if [ "$status" != "200" ]; then
            echo "::warning::The history pass answered $status. Older permits keep their last read status until the next run."
            exit 0
          fi
          node -e '
            const s = JSON.parse(require("fs").readFileSync("history.json", "utf8"));
            const h = s.history || {};
            console.log(`history ${(h.windows || []).join(" ")}: ${h.discovered || 0} read, ${h.added || 0} stored, ${h.statusChanges || 0} status change(s)`);
            if (h.errors && h.errors.length) console.log(`::warning::History pass: ${h.errors.join(" | ")}`);
            // Placing permits on the map (058). Its problems WARN, never fail.
            const lo = s.located || {};
            if (s.located) console.log(`placed on the map: ${lo.placed || 0} of ${lo.tried || 0} looked up`);
            if (lo.errors && lo.errors.length) console.log(`::warning::Placing permits: ${lo.errors.join(" | ")}`);
          '
