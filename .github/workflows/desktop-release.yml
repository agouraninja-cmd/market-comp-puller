# Builds the standalone desktop app (desktop-app/) and publishes installers
# to a GitHub Release. This is how "download the app" gets its files:
# compninja.co/download links the latest release's assets by their stable,
# version-less names (CompNinja-Setup.exe / CompNinja.dmg / CompNinja.AppImage
# — set by artifactName in desktop-app/package.json, so keep those in step
# with the /download page in server.js).
#
# Fires ONLY on a desktop-v* tag — never on ordinary pushes, so the site's
# deploy path is untouched. Cut a release with:
#   git tag desktop-v1.0.1 && git push origin desktop-v1.0.1
#
# SIGNING. macOS signing + notarization is wired but DORMANT: the Build step
# reads five repo secrets (MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_ID,
# APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID — see docs/APPLE-SIGNING.md for
# what each is and how to mint them once Apple approves the LLC's Developer
# Program enrollment). While they are unset the env vars resolve to empty
# strings, electron-builder sees no identity, and the build is byte-for-byte
# the unsigned one this workflow has always produced — Windows SmartScreen
# and macOS Gatekeeper warn on first run, and /download says so honestly.
# Windows code signing is a SEPARATE purchase (not covered by the Apple
# enrollment) and stays unsigned either way. The ci.yml rule (no repo
# secrets a fork could exfiltrate) still holds — this workflow fires only on
# tag pushes and workflow_dispatch, both of which need write access.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  # The remote-session git proxy only pushes branches, so a Claude session
  # cutting a release fires this with the tag name instead; softprops then
  # creates the tag at the dispatched commit. Same release either way.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. desktop-v1.0.0)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Create the release once, before the matrix — three jobs racing to create
  # the same release is a 422 on two of them.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: CompNinja Desktop ${{ inputs.tag || github.ref_name }}
          body: |
            The CompNinja desktop app — installs like any program, opens compninja.co in its own window, and stays current automatically (the app is the live site).

            - **Windows:** CompNinja-Setup.exe
            - **Mac:** CompNinja.dmg
            - **Linux:** CompNinja.AppImage

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: desktop-app/dist/CompNinja-Setup.exe
          - os: macos-latest
            asset: desktop-app/dist/CompNinja.dmg
          - os: ubuntu-latest
            asset: desktop-app/dist/CompNinja.AppImage
    runs-on: ${{ matrix.os }}
    env:
      # No signing identities exist; stop electron-builder looking for them
      # (macos runners otherwise fail the build hunting a keychain identity).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install build tools
        working-directory: desktop-app
        run: npm ci
      - name: Build installer
        working-directory: desktop-app
        env:
          # macOS signing/notarization — see the SIGNING note in the header.
          # Empty until the secrets exist, and empty is unset to
          # electron-builder, so unsigned builds are unchanged. Scoped to the
          # mac job because electron-builder also reads CSC_LINK for WINDOWS
          # signing — a mac .p12 leaking into that job would fail the
          # Windows build. (runner context isn't available in job-level env,
          # hence matrix.os here.)
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        run: npx electron-builder --publish never
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.asset }}
