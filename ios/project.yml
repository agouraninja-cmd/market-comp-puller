# XcodeGen spec. The .xcodeproj is generated, not committed, so it never shows
# up as a merge conflict in a repo that several people push to daily.
#
#   brew install xcodegen && cd ios && xcodegen generate
#
name: CompNinja
options:
  bundleIdPrefix: co.compninja
  deploymentTarget:
    iOS: "17.0"        # Map(selection:) and ContentUnavailableView are iOS 17
  createIntermediateGroups: true

packages:
  CompNinjaKit:
    path: CompNinjaKit

targets:
  CompNinja:
    type: application
    platform: iOS
    sources:
      - path: CompNinja
    dependencies:
      - package: CompNinjaKit
        product: CompNinjaKit
    # DEVELOPMENT_TEAM lives in one file so that filling in the Team ID once
    # enrollment lands is a one-line edit rather than a hunt through settings.
    configFiles:
      Debug: Team.xcconfig
      Release: Team.xcconfig
    info:
      path: CompNinja/Info.plist
      properties:
        CFBundleDisplayName: CompNinja
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Shown verbatim in the permission prompt. Apple rejects vague ones,
        # and this is also just true: the coordinates never leave the device.
        NSLocationWhenInUseUsageDescription: >-
          CompNinja uses your location only to fill in the address of the
          property you're standing at. Your coordinates stay on your device.
        # No encryption beyond HTTPS, so App Store Connect stops asking about
        # export compliance on every single build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.compninja.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Generated by ios/Tools/make-app-icon.swift from the brand mark.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only (Owen's call, 2026-08-28). Universal would oblige a
        # 13-inch iPad screenshot set in App Store Connect and put the iPad
        # layout in front of review, and the SwiftUI screens currently read as
        # a stretched phone there. Widening to "1,2" later is one line plus an
        # iPad layout pass.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # The kit is verified clean under `complete`; the app target is set to
        # `targeted` because its views have never been compiled (no Xcode on
        # the machine they were written on) and a wall of concurrency errors on
        # first open helps nobody. Raise it to `complete` once it builds.
        SWIFT_STRICT_CONCURRENCY: targeted
        # Debug keeps automatic signing, which is fine for simulator work.
        # Release is MANUAL -- see the configs block below.
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          # Manual signing, chosen 2026-08-28 after automatic signing could not
          # be made to produce a distribution build. With CODE_SIGN_STYLE
          # Automatic, xcodebuild decided this target was "signed for
          # development" no matter what: it asked Apple for an iOS App
          # Development profile, Apple answered "your team has no devices from
          # which to generate a provisioning profile", and the archive died.
          # Pinning CODE_SIGN_IDENTITY while style was Automatic is NOT the fix
          # and is itself a hard error ("conflicting provisioning settings").
          # An App Store profile needs no devices, so naming one explicitly
          # sidesteps the whole disagreement.
          #
          # The profile is created in the developer portal, not by Xcode. If it
          # ever expires (2027-08-28) or is regenerated, the NAME below is what
          # must match, not the UUID.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: CompNinja App Store

# Without this block no .xcscheme is written at all, and xcodebuild falls back
# to an autocreated scheme whose archive action is not pinned to Release. That
# is not cosmetic: automatic signing picks its identity from the action being
# built, so an archive that runs as Debug asks Apple for a DEVELOPMENT profile,
# which needs a registered device and fails with "Your team has no devices"
# (hit 2026-08-28). Do not pin CODE_SIGN_IDENTITY to work around that -- manual
# identity plus CODE_SIGN_STYLE: Automatic is itself a hard error
# ("conflicting provisioning settings"). Pin the CONFIGURATION, not the
# identity, and let automatic signing choose distribution on its own.
schemes:
  CompNinja:
    build:
      targets:
        CompNinja: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
