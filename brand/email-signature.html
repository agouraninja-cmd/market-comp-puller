  This is OPTION 3 (SIDE RULE - NO LOGO) from CompNinja_Email_Signatures.docx,
  the format Chuck Dickinson runs, reproduced to that document's own
  measurements: sizes, colours, line spacing and the 7px rule are lifted from
  the PDF, not approximated. Change the copy freely; change the geometry only
  against that document. The measurements and the one place this deliberately
  departs from the PDF (the wordmark's tracking) are in build notes above the
  markup in the generator, and repeated at the top of this file's history.

  HOW TO INSTALL
    Gmail   Open this file in a browser, select the block below (Ctrl/Cmd+A),
            copy, then Settings -> See all settings -> General -> Signature ->
            Create new -> paste -> Save changes at the bottom of the page.
    Outlook File -> Options -> Mail -> Signatures -> New -> paste.
    Apple   Mail -> Settings -> Signatures -> new signature -> paste, then
      Mail  UNTICK "Always match my default message font".

  NO IMAGES, so nothing here can arrive as a blocked-image placeholder and the
  signature needs no host to stay up. brand/compninja-mark.png is the extracted
  brand mark, kept for the document's logo variants (Options 4, 5 and 6); this
  format does not use it.

  Table layout and inline styles only -- Gmail strips <style> blocks and
  Outlook renders through Word. System fonts only: Arial ships everywhere,
  webfonts do not. Colours are email-shell.js's, so the signature and the
  outbound letterhead are one system: ink #1A2433, muted #68707E, red #B91C1C,
  hairline #E4E2DA on the separator dot.

  COPY RULES (CLAUDE.md): the owner is not a licensed broker, so this may
  never describe CompNinja as a brokerage or its output as an appraisal.
  "Adler" here is the CEO's own surname on his own signature -- not the
  retired Adler Industrial branding the repo rule forbids reintroducing.
